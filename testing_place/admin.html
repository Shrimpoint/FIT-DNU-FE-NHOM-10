<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Admin</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container py-5">

    <h1 class="mb-4">Quản lý sản phẩm</h1>

    <form id="product-form">

        <input type="text" id="name" class="form-control mb-3" placeholder="Tên tranh">

        <input type="number" id="price" class="form-control mb-3" placeholder="Giá">

        <input type="text" id="category" class="form-control mb-3" placeholder="Danh mục">

        <input type="text" id="image" class="form-control mb-3" placeholder="Link ảnh">

        <textarea id="description" class="form-control mb-3"></textarea>

        <button class="btn btn-primary">
            Thêm sản phẩm
        </button>

    </form>

    <hr>

    <div id="list"></div>

</div>

<script src="./js/api.js"></script>
<script src="./js/admin.js"></script>

</body>
</html>
