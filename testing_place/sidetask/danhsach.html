<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Artist Management</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <script>
        // Biến toàn cục để lưu trữ danh sách hiện tại
        let currentData = [];

        $(document).ready(function () {
            $("#btnLoad").click(function () {

                $.ajax({
                    url: "https://69fc3760fce564e2591778d9.mockapi.io/api/v1/Artists", // Mock API
                    method: "GET",
                    dataType: "json",

                    success: function (data) {
                        console.log("Dữ liệu nhận được:", data);

                        currentData = data; // Lưu dữ liệu vào biến toàn cục để tiện lấy khi sửa
                        $("#result").empty();

                        data.forEach(function (item) {
                            $("#result").append(`
                <tr>
                  <td style="text-align: center;">${item.id}</td>
                  <td><strong>${item.ArtistNames}</strong></td>
                  <td>${item.Hometown}</td>
                  <td>${item.BirthDay}</td>
                  <td>${item.University}</td>
                  <td style="text-align: center;">${item.NumArtWorks}</td>
                  <td style="text-align: center;">
                    <button class="btn btn-sm btn-warning btn-edit" data-id="${item.id}">Sửa</button>
                  </td>
                </tr>
              `);
                        });
                    },

                    error: function (xhr, status, error) {
                        console.error("Lỗi khi gọi API:", error);
                        alert("Không thể lấy dữ liệu từ API");
                    }
                });

            });

            // Sự kiện khi bấm nút "Sửa" (Do các nút này sinh ra động, nên phải dùng event delegation trên tbody)
            $("#result").on("click", ".btn-edit", function() {
                let id = $(this).data("id");
                // Tìm dữ liệu của item tương ứng trong currentData
                let item = currentData.find(x => x.id == id);
                
                if(item) {
                    // Đổ dữ liệu lên form
                    $("#editId").val(item.id);
                    $("#editName").val(item.ArtistNames);
                    $("#editHometown").val(item.Hometown);
                    $("#editBirthDay").val(item.BirthDay);
                    $("#editUniversity").val(item.University);
                    $("#editNumArtWorks").val(item.NumArtWorks);
                    
                    // Hiển thị form
                    $("#editForm").show();
                }
            });

            // Sự kiện khi bấm nút "Hủy" form sửa
            $("#btnCancel").click(function() {
                $("#editForm").hide();
            });

            // Sự kiện gửi dữ liệu cập nhật lên API
            $("#btnSave").click(function() {
                let id = $("#editId").val();
                
                let updateData = {
                    ArtistNames: $("#editName").val(),
                    Hometown: $("#editHometown").val(),
                    BirthDay: $("#editBirthDay").val(),
                    University: $("#editUniversity").val(),
                    NumArtWorks: $("#editNumArtWorks").val()
                };

                $.ajax({
                    url: "https://69fc3760fce564e2591778d9.mockapi.io/api/v1/Artists/" + id,
                    method: "PUT",
                    contentType: "application/json",
                    data: JSON.stringify(updateData),
                    success: function(response) {
                        alert("Cập nhật thành công!");
                        $("#editForm").hide();
                        // Tự động tải lại danh sách
                        $("#btnLoad").click();
                    },
                    error: function(xhr, status, error) {
                        console.error("Lỗi cập nhật:", error);
                        alert("Không thể cập nhật dữ liệu.");
                    }
                });
            });
        });
    </script>
    </div>

    <!-- Import Bootstrap 5 JS (optional, for some interactive components) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>

    <style>
        * {
            font-family: 'Be Vietnam Pro', sans-serif;
        }

        body {
            min-height: 100vh;
            background:
                linear-gradient(135deg, #141e30, #243b55);

            overflow-x: hidden;
            color: white;
        }

        .main-container {
            padding: 40px;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.08);

            border: 1px solid rgba(255, 255, 255, 0.1);

            backdrop-filter: blur(15px);

            border-radius: 24px;

            padding: 30px;

            box-shadow:
                0 8px 32px rgba(0, 0, 0, 0.3);

            animation: fadeUp 0.7s ease;
        }

        h1 {
            font-weight: 700;
            font-size: 40px;
            margin-bottom: 10px;
        }

        .subtitle {
            opacity: 0.7;
            margin-bottom: 30px;
        }

        #btnLoad {
            border: none;

            padding: 14px 28px;

            border-radius: 14px;

            background:
                linear-gradient(45deg, #00c6ff, #0072ff);

            color: white;

            font-weight: 600;

            transition: 0.3s;
        }

        #btnLoad:hover {
            transform: translateY(-3px) scale(1.03);

            box-shadow:
                0 10px 25px rgba(0, 114, 255, 0.5);
        }

        .table-container {
            margin-top: 30px;

            overflow: hidden;

            border-radius: 20px;
        }

        table {
            overflow: hidden;

            border-radius: 20px !important;
        }

        thead {
            background:
                linear-gradient(45deg, #4facfe, #00f2fe);
        }

        thead th {
            border: none !important;

            color: white;

            text-align: center;

            padding: 18px !important;
        }

        tbody tr {
            transition: 0.3s;
        }

        tbody tr:hover {
            background: rgba(255, 255, 255, 0.08);

            transform: scale(1.01);
        }

        tbody td {
            vertical-align: middle;

            color: white;

            background: rgba(255, 255, 255, 0.03);

            border-color: rgba(255, 255, 255, 0.08);
        }

        .btn-edit {
            border: none;

            background:
                linear-gradient(45deg, #f7971e, #ffd200);

            color: black;

            font-weight: 600;

            padding: 8px 16px;

            border-radius: 10px;

            transition: 0.3s;
        }

        .btn-edit:hover {
            transform: scale(1.08);

            box-shadow:
                0 8px 20px rgba(255, 210, 0, 0.4);
        }

        #editForm {
            margin-top: 30px;

            animation: fadeUp 0.5s ease;
        }

        .edit-box {
            background: rgba(255, 255, 255, 0.08);

            backdrop-filter: blur(15px);

            border-radius: 24px;

            padding: 25px;

            border: 1px solid rgba(255, 255, 255, 0.1);

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .form-control {
            background: rgba(255, 255, 255, 0.08);

            border: 1px solid rgba(255, 255, 255, 0.15);

            color: white;

            border-radius: 12px;

            padding: 12px;
        }

        .form-control:focus {
            background: rgba(255, 255, 255, 0.12);

            color: white;

            border-color: #00c6ff;

            box-shadow: 0 0 15px rgba(0, 198, 255, 0.5);
        }

        label {
            margin-bottom: 8px;
            font-weight: 500;
        }

        #btnSave {
            background:
                linear-gradient(45deg, #00b09b, #96c93d);

            border: none;

            padding: 10px 20px;

            border-radius: 12px;

            font-weight: 600;
        }

        #btnCancel {
            border-radius: 12px;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(25px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        ::placeholder {
            color: rgba(255, 255, 255, 0.6) !important;
        }

        @media(max-width: 768px) {
            .main-container {
                padding: 20px;
            }

            h1 {
                font-size: 28px;
            }
        }
    </style>
</head>

<body>

    <div class="container main-container">

        <div class="glass-card">

            <h1>🎨 Artist Dashboard</h1>

            <p class="subtitle">
                Quản lý nghệ sĩ bằng AJAX + jQuery + MockAPI
            </p>

            <button id="btnLoad">
                Load Artists
            </button>

            <!-- FORM -->
            <div id="editForm" style="display: none;">

                <div class="edit-box">

                    <h3 class="mb-4">
                        ✏️ Cập nhật nghệ sĩ
                    </h3>

                    <input type="hidden" id="editId">

                    <div class="mb-3">
                        <label>Artist Name</label>
                        <input type="text" id="editName" class="form-control">
                    </div>

                    <div class="mb-3">
                        <label>Hometown</label>
                        <input type="text" id="editHometown" class="form-control">
                    </div>

                    <div class="mb-3">
                        <label>BirthDay</label>
                        <input type="text" id="editBirthDay" class="form-control">
                    </div>

                    <div class="mb-3">
                        <label>University</label>
                        <input type="text" id="editUniversity" class="form-control">
                    </div>

                    <div class="mb-3">
                        <label>NumArtWorks</label>
                        <input type="number" id="editNumArtWorks" class="form-control">
                    </div>

                    <button id="btnSave" class="btn text-white me-2">
                        Save
                    </button>

                    <button id="btnCancel" class="btn btn-light">
                        Cancel
                    </button>

                </div>

            </div>

            <!-- TABLE -->
            <div class="table-container">

                <table class="table align-middle">

                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Artist</th>
                            <th>Hometown</th>
                            <th>BirthDay</th>
                            <th>University</th>
                            <th>ArtWorks</th>
                            <th>Action</th>
                        </tr>
                    </thead>

                    <tbody id="result"></tbody>

                </table>

            </div>

        </div>

    </div>

</body>
</html>
