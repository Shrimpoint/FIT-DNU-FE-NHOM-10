<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Art Gallery | Public Showcase</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/testing_place/style.css">
    <script src="/testing_place/js.js"></script>
</head>
<body class="bg-white text-dark">

    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white py-3">
        <div class="container">
            <a class="navbar-brand fs-3 fw-bold" href="#">ArtGallery.</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link active" href="#">Exhibitions</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Artists</a></li>
                    <li class="nav-item"><a class="nav-link" href="admin.html">Admin Login</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Header & Filters -->
    <div class="container mt-5">
        <h1 class="text-center mb-4">Curated Abstracts</h1>
        <div class="d-flex justify-content-center mb-5" id="filters">
            <button class="btn btn-outline-dark mx-1 filter-btn active" data-filter="all">All</button>
            <button class="btn btn-outline-dark mx-1 filter-btn" data-filter="abstract">Abstract</button>
            <button class="btn btn-outline-dark mx-1 filter-btn" data-filter="modern">Modern</button>
        </div>

        <!-- Masonry Gallery -->
        <div class="row" id="masonry-grid" data-masonry='{"percentPosition": true }'>
            <!-- Art Item 1 -->
            <div class="col-md-4 col-sm-6 mb-4 art-item abstract">
                <div class="card gallery-item">
                    <img src="https://source.unsplash.com/random/800x1000/?abstract,art" class="card-img-top" alt="Artwork">
                    <div class="card-body d-flex justify-content-between align-items-center bg-white">
                        <div>
                            <h5 class="card-title mb-0" style="font-family: 'Playfair Display', serif;">Ethereal Dream</h5>
                            <small class="text-muted">Abstract</small>
                        </div>
                        <i class="fa-regular fa-heart fs-4 like-btn" data-id="1"></i>
                    </div>
                </div>
            </div>
            <!-- Art Item 2 -->
            <div class="col-md-4 col-sm-6 mb-4 art-item modern">
                <div class="card gallery-item">
                    <img src="https://source.unsplash.com/random/800x600/?modern,art" class="card-img-top" alt="Artwork">
                    <div class="card-body d-flex justify-content-between align-items-center bg-white">
                        <div>
                            <h5 class="card-title mb-0" style="font-family: 'Playfair Display', serif;">Geometric Shift</h5>
                            <small class="text-muted">Modern</small>
                        </div>
                        <i class="fa-regular fa-heart fs-4 like-btn" data-id="2"></i>
                    </div>
                </div>
            </div>
            <!-- Thêm các Art Items khác tương tự ở đây -->
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/masonry-layout@4.2.2/dist/masonry.pkgd.min.js"></script>
    <script src="main.js"></script>
</body>
</html>
