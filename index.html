<!doctype html>
<html lang="en" class="h-full">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ArtGallery - Discover Contemporary Art</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
  <script src="/_sdk/element_sdk.js"></script>
  <script src="/_sdk/data_sdk.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&amp;family=Outfit:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet">
  <style>
    html, body { height: 100%; margin: 0; }
    body { font-family: 'Outfit', sans-serif; }
    .font-heading { font-family: 'Playfair Display', serif; }

    @keyframes float-slow { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-30px)} }
    @keyframes pulse-glow { 0%,100%{opacity:0.3} 50%{opacity:0.6} }
    @keyframes shimmer { 0%{background-position:0% 0%} 100%{background-position:100% 100%} }
    @keyframes card-entrance { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }

    .float-slow { animation: float-slow 8s ease-in-out infinite; }
    .pulse-glow { animation: pulse-glow 4s ease-in-out infinite; }
    .card-entrance { animation: card-entrance 0.6s ease-out forwards; }
    .shimmer-gradient { background: linear-gradient(45deg, #ff006e, #8338ec, #3a86ff, #ff006e); background-size: 200% 200%; animation: shimmer 6s ease infinite; }

    .glass { background: rgba(255,255,255,0.08); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.12); }
    .glass-light { background: rgba(255,255,255,0.95); border: 1px solid rgba(0,0,0,0.08); box-shadow: 0 8px 32px rgba(0,0,0,0.1); }

    .art-card { 
      transition: all 0.5s cubic-bezier(0.23, 1, 0.320, 1);
      position: relative;
      overflow: hidden;
      border-radius: 16px;
    }
    .art-card:hover { transform: translateY(-12px); }
    .art-card-img { width: 100%; height: 280px; object-fit: cover; transition: transform 0.5s ease; }
    .art-card:hover .art-card-img { transform: scale(1.05); }

    .like-btn { transition: all 0.3s ease; }
    .like-btn.liked { transform: scale(1.2); }
    .like-btn:active { transform: scale(0.95); }

    .filter-tag {
      cursor: pointer;
      transition: all 0.3s ease;
      border: 2px solid transparent;
    }
    .filter-tag.active { border-color: currentColor; }

    .gradient-text { background: linear-gradient(135deg, #ff006e, #8338ec, #3a86ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  </style>
  <style>body { box-sizing: border-box; }</style>
 </head>
 <body class="h-full bg-gradient-to-br from-white via-slate-50 to-blue-50 text-slate-900 overflow-auto">
  <div id="app" class="w-full min-h-full flex flex-col">
   <!-- Background Elements -->
   <div class="fixed inset-0 pointer-events-none overflow-hidden -z-10">
    <div class="absolute top-0 right-0 w-96 h-96 bg-pink-300/10 rounded-full blur-3xl pulse-glow"></div>
    <div class="absolute bottom-20 left-0 w-80 h-80 bg-blue-300/10 rounded-full blur-3xl pulse-glow" style="animation-delay:2s"></div>
    <div class="absolute top-1/2 left-1/2 w-72 h-72 bg-purple-300/10 rounded-full blur-3xl pulse-glow" style="animation-delay:1s"></div>
   </div><!-- Navigation -->
   <nav class="sticky top-0 z-40 backdrop-blur-xl bg-white/80 border-b border-slate-200/50">
    <div class="max-w-7xl mx-auto px-4 md:px-8 py-4 flex items-center justify-between">
     <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl shimmer-gradient p-1 flex items-center justify-center">
       <i data-lucide="palette" class="w-5 h-5 text-white"></i>
      </div><span id="nav-title" class="font-heading font-bold text-2xl gradient-text">ArtGallery</span>
     </div>
     <div class="flex items-center gap-3">
      <div class="relative hidden md:block"><input id="search-input" type="text" placeholder="Search artworks..." class="pl-10 pr-4 py-2 rounded-lg border border-slate-200 bg-white focus:outline-none focus:ring-2 focus:ring-pink-500 text-sm w-64"> <i data-lucide="search" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
      </div><a href="admin.html" id="toggle-admin" class="px-4 py-2 text-sm font-medium rounded-lg glass hover:bg-slate-100/50 transition flex items-center gap-2"> <i data-lucide="lock" class="w-4 h-4"></i> <span id="admin-label">Admin</span> </a> <button id="toggle-theme" class="p-2 rounded-lg hover:bg-slate-100 transition"> <i data-lucide="sun" class="w-5 h-5"></i> </button>
     </div>
    </div>
   </nav><!-- Public Gallery View -->
   <div id="public-view" class="flex-1">
    <!-- Hero -->
    <section class="max-w-7xl mx-auto px-4 md:px-8 py-16 md:py-24">
     <div class="text-center mb-16">
      <h1 id="gallery-title" class="font-heading font-black text-5xl md:text-6xl mb-4 gradient-text">ArtGallery</h1>
      <p id="gallery-subtitle" class="text-xl text-slate-600 max-w-2xl mx-auto">Discover contemporary art from talented artists worldwide. Curated collections of inspiring work.</p>
     </div><!-- Filter Section -->
     <div class="mb-12">
      <div class="glass-light rounded-2xl p-6 md:p-8">
       <h2 class="font-heading font-bold text-xl mb-4 flex items-center gap-2"><i data-lucide="sliders" class="w-5 h-5 text-pink-600"></i> Filter by Style</h2>
       <div id="filter-container" class="flex flex-wrap gap-3">
        <button class="filter-tag px-4 py-2 rounded-full bg-slate-100 text-slate-700 font-medium active hover:bg-slate-200 transition" data-style="all"> All Styles </button> <button class="filter-tag px-4 py-2 rounded-full bg-slate-100 text-slate-700 font-medium hover:bg-slate-200 transition" data-style="abstract"> Abstract </button> <button class="filter-tag px-4 py-2 rounded-full bg-slate-100 text-slate-700 font-medium hover:bg-slate-200 transition" data-style="landscape"> Landscape </button> <button class="filter-tag px-4 py-2 rounded-full bg-slate-100 text-slate-700 font-medium hover:bg-slate-200 transition" data-style="portrait"> Portrait </button> <button class="filter-tag px-4 py-2 rounded-full bg-slate-100 text-slate-700 font-medium hover:bg-slate-200 transition" data-style="digital"> Digital </button>
       </div>
      </div>
     </div>
    </section><!-- Masonry Gallery -->
    <section class="max-w-7xl mx-auto px-4 md:px-8 pb-20">
     <div id="gallery-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 auto-rows-max">
      <!-- Gallery cards populated by JS -->
     </div>
     <div id="empty-state" class="text-center py-16">
      <i data-lucide="image" class="w-16 h-16 mx-auto text-slate-300 mb-4"></i>
      <p class="text-slate-500 text-lg">No artworks yet. Check back soon!</p>
     </div>
    </section>
   </div><!-- Artwork Detail Modal -->
   <div id="detail-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4">
    <div class="absolute inset-0 bg-black/40 backdrop-blur-sm" id="modal-backdrop"></div>
    <div class="relative glass-light rounded-2xl max-w-2xl w-full max-h-90vh overflow-y-auto">
     <div class="sticky top-0 flex items-center justify-between p-6 border-b border-slate-200/30 bg-white/80 backdrop-blur-sm">
      <h3 id="modal-title" class="font-heading font-bold text-2xl">Artwork Title</h3><button id="close-modal" class="p-2 hover:bg-slate-100 rounded-lg transition"><i data-lucide="x" class="w-5 h-5"></i></button>
     </div>
     <div class="p-6 space-y-6">
      <div id="modal-image" class="w-full h-96 bg-gradient-to-br from-slate-200 to-slate-300 rounded-xl overflow-hidden flex items-center justify-center"><img src="" alt="" class="w-full h-full object-cover" onerror="this.style.background='linear-gradient(135deg, #ff006e, #8338ec)'">
      </div>
      <div class="space-y-3">
       <div class="flex items-center justify-between">
        <div>
         <p id="modal-artist" class="text-sm text-slate-600 mb-1">Artist Name</p>
         <p id="modal-style" class="inline-block text-xs px-3 py-1 rounded-full bg-pink-100 text-pink-700 font-medium">Style</p>
        </div>
        <div class="flex items-center gap-2 px-4 py-2 rounded-lg bg-slate-50"><i data-lucide="heart" class="w-5 h-5 text-pink-600"></i> <span id="modal-likes" class="font-semibold text-lg">0</span>
        </div>
       </div>
       <p id="modal-description" class="text-slate-700 leading-relaxed">Artwork description...</p>
       <div class="flex items-center justify-between pt-4 border-t border-slate-100"><span class="text-sm text-slate-600" id="modal-year">Year: 2024</span> <button id="modal-like-btn" class="px-6 py-2 rounded-lg bg-gradient-to-r from-pink-600 to-purple-600 text-white font-semibold hover:shadow-lg transition-all flex items-center gap-2"> <i data-lucide="heart" class="w-4 h-4"></i> Like This Artwork </button>
       </div>
      </div>
     </div>
    </div>
  </div>
  <script src="./JS/main.js"></script>
 </body>
</html>
