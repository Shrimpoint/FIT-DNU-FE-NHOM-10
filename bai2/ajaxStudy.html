<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8" />
    <title>Call API bằng AJAX</title>

    <!-- Import jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>

<body>

    <h2>Danh sách dữ liệu</h2>
    <button id="btnLoad">Lấy dữ liệu</button>

    <table id="result" border="1" cellspacing="0" cellpadding="8">
        <thead>
            <tr>
                <th>ID</th>
                <th>Tên</th>
                <th>Tuổi</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <script>
        $(document).ready(function () {
            $("#btnLoad").click(function () {

                $.ajax({
                    url: "", // Mock API
                    method: "GET",
                    dataType: "json",

                    success: function (data) {
                        console.log("Dữ liệu nhận được:", data);

                        const tbody = $("#result tbody");
                        tbody.empty();

                        data.forEach(function (item) {
                            tbody.append(`
                                <tr>
                                    <td>${item.id}</td>
                                    <td>${item.name}</td>
                                    <td>${item.tuoi}</td>
                                </tr>
                            `);
                        });
                    },

                    error: function (xhr, status, error) {
                        console.error("Lỗi khi gọi API:", error);
                        alert("Không thể lấy dữ liệu từ API");
                    }
                });

            });
        });
    </script>

</body>

</html>
