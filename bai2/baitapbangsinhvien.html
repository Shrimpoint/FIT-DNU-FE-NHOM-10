<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="baitapbangsingvien.css">
</head>
<body>
    <div class="container">
        <h1 class="title">Quản Lý Danh Sách Sinh Viên</h1>

        <!-- Form thêm sinh viên -->
        <div class="form-section">
            <h2>Thêm Sinh Viên Mới</h2>
            <div class="form-group">
                <input type="text" id="inputName" placeholder="Họ tên" class="input-field" />
                <input type="text" id="inputMaso" placeholder="Mã sinh viên" class="input-field" />
                <input type="number" id="inputAge" placeholder="Tuổi" class="input-field" />
                <button onclick="themSinhVienMoi()" class="btn btn-success">Thêm Sinh Viên</button>
            </div>
        </div>

        <div class="button-group">
            <button onclick="laySinhVien()" class="btn btn-primary">Tải Danh Sách</button>
        </div>

        <!-- Thanh tìm kiếm -->
        <div class="search-section">
            <input type="text" id="searchInput" placeholder="Tìm kiếm theo tên hoặc mã sinh viên..." class="search-field" onkeyup="timKiemSinhVien()" />
            <button onclick="clearSearch()" class="btn btn-secondary">Xóa Tìm Kiếm</button>
        </div>

        <div class="table-section">
            <table class="table">
                <thead>
                    <tr>
                        <th>Id</th>
                        <th>Mã SV</th>
                        <th>Tên Sinh Viên</th>
                        <th>Tuổi</th>
                        <th>Hành Động</th>
                    </tr>
                </thead>
                <tbody id="danhSach">
                </tbody>
            </table>
        </div>
    </div>

    <script src="baitapbangsinhvien.js"></script>
</body>
</html>
